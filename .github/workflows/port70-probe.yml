name: port70 probe
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe google drive ids
        run: |
          for id in 1LJToGQ0mdLoC4QUy-_OzjXl0ZTfEmpZa 1sE4RaoHmdU4TxlETruYmkkmR5qJvl9Yc 1oUjqDsG_I8Eyft0Z7gHTPLDsuVXtYIW0 1h9QIzh3gpvSvVB4L_m9QlMs6d56tGY8S; do
            code=$(curl -sSL -o "/tmp/$id.bin" -w "%{http_code}" "https://drive.google.com/uc?export=download&id=$id" -m 180 || echo curlfail)
            echo "id=$id code=$code bytes=$(stat -c%s /tmp/$id.bin 2>/dev/null)"
            md5sum "/tmp/$id.bin" 2>/dev/null
            head -c 100 "/tmp/$id.bin" | od -c | head -2
            echo "-----"
          done
          echo "list folder for-arena:"
          curl -sL -m 60 "https://drive.google.com/drive/folders/1h9QIzh3gpvSvVB4L_m9QlMs6d56tGY8S" | grep -o 'target="_blank"[^<]*' | head -5 || true
