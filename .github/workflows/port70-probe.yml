name: port70 probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tool imports and the page/fixture agree
        run: |
          python -m pip install -q pefile
          python -c "import ast;ast.parse(open('tools/mod/gamedata_rows.py').read());print('gamedata_rows.py parses')"
          python - <<'PY'
          page=open('docs/ennorath/gamedata-rows.md').read()
          rows=[l for l in page.splitlines() if l.startswith('| `') and l.count('|')>=8]
          fx=[l.split('\t') for l in open('engine/tests/data/port70/gamedata-rows.txt').read().splitlines() if l and not l.startswith('#')]
          print('page rows',len(rows),'fixture rows',len(fx))
          names=[r[1] for r in fx]
          assert len(names)==len(set(names)), 'duplicate field in the fixture'
          assert len(rows)==len(fx), 'page and fixture disagree on the row count'
          for line,cell in zip(rows,fx):
              c=[x.strip() for x in line.strip().strip('|').split('|')]
              assert c[0].strip('`')==cell[1], (c[0],cell[1])
              assert c[1]==cell[2] and c[2]==cell[3], (c[1],c[2],cell)
          print('page and fixture agree, row by row')
          PY
      - name: build and run PORT-70
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build cmake g++ >/dev/null
          mkdir -p /tmp/out
          cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENBFME_BUILD_GODOT=OFF > /tmp/out/cmake.log 2>&1 || echo cmake-failed
          cmake --build engine/build -j2 --target openbfme_tests > /tmp/out/build.log 2>&1 || echo build-failed
          if [ -x engine/build/openbfme_tests ]; then engine/build/openbfme_tests -tc="PORT-70*" > /tmp/out/tests.log 2>&1 || true; fi
          tail -25 /tmp/out/tests.log 2>/dev/null || tail -30 /tmp/out/build.log 2>/dev/null || true
      - name: spool
        if: always()
        run: |
          mkdir -p .spool/port70 && cp /tmp/out/*.log .spool/port70/ 2>/dev/null || true
          git config user.email "actions@github.com"; git config user.name "port70 probe"
          git checkout -B spool/port70-data
          git add -f .spool
          git commit -m "port70 spool: build and test logs (scratch, never merged)" || true
          git push -f origin HEAD:refs/heads/spool/port70-data
