name: port70 probe
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tool imports and the page/fixture agree
        run: |
          python -m pip install -q pefile
          python -c "import ast;ast.parse(open('tools/mod/gamedata_rows.py').read());print('gamedata_rows.py parses')"
          python - <<'PY'
          import re,sys
          page=open('docs/ennorath/gamedata-rows.md').read()
          rows=[l for l in page.splitlines() if l.startswith('| `') and l.count('|')>=8]
          fx=[l.split('\t') for l in open('engine/tests/data/port70/gamedata-rows.txt').read().splitlines() if l and not l.startswith('#')]
          print('page rows',len(rows),'fixture rows',len(fx))
          names=[r[1] for r in fx]
          assert len(names)==len(set(names)), 'duplicate field in the fixture'
          assert len(rows)==len(fx), 'page and fixture disagree on the row count'
          for line,cell in zip(rows,fx):
              c=[x.strip() for x in line.strip().strip('|').split('|')]
              assert c[0].strip('`')==cell[1], (c[0],cell[1])
              assert c[1]==cell[2] and c[2]==cell[3], (c[1],c[2],cell)
          print('page and fixture agree, row by row')
          PY
      - name: build and run PORT-70
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build cmake g++ >/dev/null
          cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENBFME_BUILD_GODOT=OFF > /tmp/cmake.log 2>&1 || { tail -40 /tmp/cmake.log; exit 1; }
          cmake --build engine/build -j2 --target openbfme_tests > /tmp/build.log 2>&1 || { tail -60 /tmp/build.log; exit 1; }
          engine/build/openbfme_tests -tc="PORT-70*" 2>&1 | tail -30
