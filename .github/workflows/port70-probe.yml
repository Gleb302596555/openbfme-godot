name: port70 probe
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch inputs
        run: |
          set -e
          mkdir -p /tmp/in
          dl() { id="$1"; dst="$2"; curl -sSL -o "$dst" -w "id=$id code=%{http_code} bytes=%{size_download}\n" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" -m 900 || echo "curl failed $id"; }
          dl 1LJToGQ0mdLoC4QUy-_OzjXl0ZTfEmpZa /tmp/in/game1.dat
          dl 1j7ahtZKstGedIoKdJW3sy3mqG2oxiQ_2 /tmp/in/game2.dat
          dl 1oUjqDsG_I8Eyft0Z7gHTPLDsuVXtYIW0 /tmp/in/ennorath-ini.zip
          dl 1sE4RaoHmdU4TxlETruYmkkmR5qJvl9Yc /tmp/in/audit.zip
          md5sum /tmp/in/* || true
          for f in /tmp/in/*; do echo "== $f"; head -c 200 "$f" | tr -d '\0' | head -3; echo; done
      - name: analyse
        run: |
          python -m pip install -q capstone pefile
          mkdir -p /tmp/out
          { md5sum /tmp/in/*; } > /tmp/out/inputs.txt 2>&1 || true
          python tools/mod/gamedata_rows.py --game /tmp/in/game1.dat --ini /tmp/in/ennorath-ini.zip --port engine/src/GameLogic/GameLogicSettings.cpp --out /tmp/out > /tmp/out/run.log 2>&1 || true
          tail -5 /tmp/out/run.log
          ls -la /tmp/out
      - name: spool results
        run: |
          mkdir -p .spool/port70 && cp -r /tmp/out/. .spool/port70/ || true
          rm -f .spool/port70/*.dat .spool/port70/*.zip
          git config user.email "actions@github.com"; git config user.name "port70 probe"
          git checkout -B spool/port70-data
          git add -f .spool
          git commit -m "port70 spool: raw analysis output (scratch, never merged)" || true
          git push -f origin HEAD:refs/heads/spool/port70-data
