name: port70 probe
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch inputs
        run: |
          set -e
          mkdir -p /tmp/in
          dl() { id="$1"; dst="$2"; curl -sSL -o "$dst" -w "id=$id code=%{http_code} bytes=%{size_download}\n" "https://drive.google.com/uc?export=download&id=$id" -m 600 || echo "curl failed $id"; }
          dl 1LJToGQ0mdLoC4QUy-_OzjXl0ZTfEmpZa /tmp/in/game1.dat
          dl 1j7ahtZKstGedIoKdJW3sy3mqG2oxiQ_2 /tmp/in/game2.dat
          dl 1oUjqDsG_I8Eyft0Z7gHTPLDsuVXtYIW0 /tmp/in/ennorath-ini.zip
          dl 1sE4RaoHmdU4TxlETruYmkkmR5qJvl9Yc /tmp/in/audit.zip
          ls -la /tmp/in
          md5sum /tmp/in/* || true
          head -c 64 /tmp/in/game1.dat | od -c | head -2
      - name: analyse
        run: |
          python -m pip install -q capstone pefile
          mkdir -p /tmp/out
          cp /tmp/in/* /tmp/out/ 2>/dev/null || true
          ls -la /tmp/in > /tmp/out/inputs.txt 2>&1
          md5sum /tmp/in/* >> /tmp/out/inputs.txt 2>&1 || true
          python tools/mod/gamedata_rows.py --game /tmp/in/game1.dat --ini /tmp/in/ennorath-ini.zip --port engine/src/GameLogic/GameLogicSettings.cpp --out /tmp/out 2>&1 | tee /tmp/out/run.log || true
          ls -la /tmp/out
      - name: spool results
        run: |
          mkdir -p .spool/port70 && cp -r /tmp/out/. .spool/port70/ || true
          rm -f .spool/port70/*.dat .spool/port70/*.zip
          git config user.email "actions@github.com"; git config user.name "port70 probe"
          git checkout -B spool/port70-data
          git add -f .spool
          git commit -m "port70 spool: raw analysis output (scratch, never merged)" || true
          git push -f origin spool/port70-data
