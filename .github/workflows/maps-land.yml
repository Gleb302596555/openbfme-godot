# The maps run's commit lands by itself (owner 2026-11-20): sandbox 3 (tools/colab/nightly_maps.sh) pushes the generated tables to auto/maps;
# this job checks them with tools/ci/maps_land.py (only the maps files, whole tables, no unfinished run) and puts them on top of the current
# main. A red check leaves auto/maps for Claude. The tool runs from main, never from the pushed branch.
name: Maps land

on:
  push:
    branches: [auto/maps]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maps-land
  cancel-in-progress: false

jobs:
  land:
    name: "Maps: check and land on main"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check and land
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp tools/ci/maps_land.py "$RUNNER_TEMP/maps_land.py"
          for attempt in 1 2 3; do
            git fetch -q origin main auto/maps
            python3 "$RUNNER_TEMP/maps_land.py" --head origin/auto/maps --main origin/main --commit || exit 1
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || git merge-base --is-ancestor HEAD origin/main; then
              echo "nothing to push"; exit 0
            fi
            git push origin HEAD:main && exit 0
            echo "main moved while landing (attempt $attempt): again on the new main"
          done
          exit 1
