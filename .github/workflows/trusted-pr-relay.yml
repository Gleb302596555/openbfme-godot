# The trusted-PR relay (owner 2026-11-21): a trusted person's agent whose platform token cannot open a pull request into this repository pushes a
# marker commit ("PR READY: <title>") to its fork's branch; tools/ci/trusted_pr_relay.py opens the pull request and starts the fork's build check by
# hand (a pull request opened with this workflow's token starts no workflow by itself). Only GitHub's API: no code of the fork is checked out or run.
name: Trusted PR relay

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: trusted-pr-relay
  cancel-in-progress: false

jobs:
  relay:
    name: "Trusted PR relay"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: tools/ci
      - name: Open the marked pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/trusted_pr_relay.py
